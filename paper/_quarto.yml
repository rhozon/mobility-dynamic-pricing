project:
  type: default

format:
  pdf:
    pdf-engine: xelatex
    documentclass: article
    papersize: a4
    geometry: margin=2.5cm
    fontsize: 11pt
    number-sections: true
    colorlinks: true
    linkcolor: blue
    citecolor: blue
    urlcolor: blue
    keep-tex: false
    include-in-header:
      text: |
        \usepackage{booktabs}
        \usepackage{longtable}

execute:
  echo: false
  warning: false
  message: false

bibliography: references.bib
link-citations: true
