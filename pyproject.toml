[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mobility-dynamic-pricing"
version = "0.1.0"
description = "Dynamic pricing for ride-hailing in New York City: fare model, demand forecast, rider choice dynamics after a natural price shock, and an evolutionary simulator of riders and drivers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rodrigo Hermont Ozon" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "duckdb>=1.1",
    "statsmodels>=0.14",
    "scipy>=1.11",
    "xgboost>=2.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "fastapi>=0.110", "httpx>=0.27", "pyshp>=2.3", "shapely>=2.0"]

[tool.setuptools.packages.find]
include = ["mdp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
